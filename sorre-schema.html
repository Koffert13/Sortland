<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorre · schema juli–augusti 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0B1120;
  --surface:#141C2E;
  --surface-2:#1B2439;
  --rule:#28334C;
  --text:#E9EDF6;
  --muted:#8B97AE;
  --day:#F5B841;
  --eve:#D65DA0;
  --night:#5B8DEF;
  --free:#2A3450;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--text);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  padding:0 0 48px;
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{padding:28px 0 18px}
.kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px
}
h1{
  font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);
  line-height:.95;letter-spacing:-.035em;margin:0
}
h1 em{font-style:normal;color:var(--muted)}
.months{display:flex;gap:6px;margin-top:18px}
.months button{
  flex:1;padding:11px 8px;border-radius:11px;border:1px solid var(--rule);
  background:transparent;color:var(--muted);font-family:var(--body);
  font-weight:600;font-size:14px;cursor:pointer;transition:.18s
}
.months button[aria-pressed="true"]{border-color:#3A4A6E}

/* ---------- date strip ---------- */
.strip{
  display:flex;gap:6px;overflow-x:auto;padding:16px 16px 10px;margin:0 -16px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch
}
.strip::-webkit-scrollbar{display:none}
.strip{scrollbar-width:none}
.chip{
  flex:0 0 auto;width:46px;padding:8px 0 9px;border-radius:12px;border:1px solid var(--rule);
  background:var(--surface);color:var(--muted);text-align:center;cursor:pointer;
  scroll-snap-align:center;transition:.15s
}
.chip .dw{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;display:block}
.chip .dn{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;display:block;color:var(--text)}
.chip .dots{display:flex;gap:2px;justify-content:center;margin-top:5px;height:4px}
.chip .dots i{width:4px;height:4px;border-radius:50%;background:var(--free)}
.chip[aria-selected="true"]{background:#F5F7FF;border-color:#F5F7FF}
.chip[aria-selected="true"] .dn,.chip[aria-selected="true"] .dw{color:#0B1120}
.chip.weekend .dw{color:var(--eve)}

/* ---------- ribbon ---------- */
.daybar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 0 4px}
.daybar h2{
  font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0
}
.daybar .onshift{font-family:var(--mono);font-size:11px;color:var(--muted)}
.arrows{display:flex;gap:6px}
.arrows button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);
  color:var(--text);font-size:15px;cursor:pointer;line-height:1
}
.axis{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
  color:var(--muted);padding:0 0 4px;margin-left:64px;letter-spacing:.05em
}
.rows{border-top:1px solid var(--rule)}
.row{
  display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer
}
.row:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.who{
  font-family:var(--body);font-weight:600;font-size:12.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.track{
  position:relative;height:30px;border-radius:8px;background:var(--surface);
  background-image:linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:calc(100%/4) 100%;overflow:hidden
}
.bar{
  position:absolute;top:3px;bottom:3px;border-radius:6px;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;
  font-family:var(--mono);font-size:9.5px;font-weight:600;color:#0B1120;white-space:nowrap
}
.bar.day{background:var(--day)}
.bar.eve{background:var(--eve);color:#180B14}
.bar.night{background:var(--night);color:#050B18}
.bar.long::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(11,17,32,.16) 0 5px,transparent 5px 11px)
}
.bar.spill{opacity:.32;border-radius:0 6px 6px 0;left:0!important}
.bar .cont{margin-left:auto;opacity:.7}
.now{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.75;z-index:3}
.free{
  font-family:var(--mono);font-size:10px;color:var(--muted);
  position:absolute;left:8px;top:50%;transform:translateY(-50%)
}
.soloing .row{opacity:.32}
.soloing .row.on{opacity:1}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:16px 0 4px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.hint{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}

/* ---------- month grid ---------- */
.section-h{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)
}
.grid{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}
.grid th{
  color:var(--muted);font-weight:400;padding:0 0 8px;text-align:center;
  font-size:9.5px;letter-spacing:.06em
}
.grid th:first-child{text-align:left;width:52px}
.grid td{padding:0;height:20px}
.grid td:first-child{
  color:var(--muted);white-space:nowrap;font-size:9.5px;padding-right:6px
}
.grid tr.sel td:first-child{color:var(--text)}
.grid tr.we td:first-child{color:var(--eve);opacity:.85}
.cell{display:flex;gap:1.5px;justify-content:center;padding:2px 1.5px}
.cell b{display:block;height:15px;flex:1;border-radius:3px;background:var(--free)}
.cell b.day{background:var(--day)}
.cell b.eve{background:var(--eve)}
.cell b.night{background:var(--night)}
.grid tbody tr{cursor:pointer}
.grid tbody tr.sel{background:var(--surface-2);outline:1px solid #3A4A6E}

footer{margin-top:34px;font-size:10.5px;color:var(--muted);line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Avdelningsschema · 2026</p>
    <h1>Vem jobbar<br><em>när?</em></h1>
    <div class="months" id="months"></div>
  </header>

  <div class="strip" id="strip" role="tablist" aria-label="Välj dag"></div>

      <button id="next" aria-label="Nästa dag">›</button>
    </div>
  </div>
  <p class="onshift" id="summary" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 12px"></p>

  <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  <div class="rows" id="rows"></div>

  <div class="legend">
    <span><i style="background:var(--day)"></i>Dag</span>
    <span><i style="background:var(--eve)"></i>Kväll</span>
    <span><i style="background:var(--night)"></i>Natt</span>
    <span><i style="background:var(--free);"></i>Ledig</span>
    <span><i style="background:repeating-linear-gradient(115deg,#F5B841 0 3px,#0B1120 3px 6px)"></i>Långpass 10 h+</span>
  </div>
  <p class="hint">Tryck på ett namn för att lyfta fram bara den personen. Blek stapel längst till vänster = nattpass som pågår från kvällen innan.</p>

  <p class="section-h" id="monthHead">Hela månaden</p>
  <table class="grid" id="grid"></table>

  <footer id="foot"></footer>
</div>

const MONTHS = Object.keys(DATA);
const MN = {Juli:"juli", Augusti:"augusti"};
const PEOPLE = DATA[MONTHS[0]].people;

let month = MONTHS[0];
let dayIdx = 0;
let solo = null;

const kind = s => s.s === null ? "day" : (s.s >= 18*60 ? "night" : (s.s >= 12*60 ? "eve" : "day"));
const dur  = s => s.s === null ? 0 : (s.e >= s.s ? s.e - s.s : (1440 - s.s) + s.e);
const days = () => DATA[month].days;
const pct  = m => (m / 1440 * 100);

/* ---------- month buttons ---------- */
const monthsEl = document.getElementById("months");
MONTHS.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m;
  b.onclick = () => { month = m; dayIdx = 0; renderAll(); };
  monthsEl.appendChild(b);
});

/* ---------- date strip ---------- */
function renderStrip(){
  const el = document.getElementById("strip");
  el.innerHTML = "";
  days().forEach((d, i) => {
    const c = document.createElement("button");
    c.className = "chip" + (["Lör","Sön"].includes(d.dow) ? " weekend" : "");
    c.setAttribute("aria-selected", i === dayIdx);
    const dots = PEOPLE.map(p => {
      const list = d.shifts[p];
      if(!list.length) return '<i></i>';
      return '<i style="background:var(--' + kind(list[0]) + ')"></i>';
    }).join("");
    c.innerHTML = '<span class="dw">' + d.dow + '</span><span class="dn">' +
      Number(d.date.slice(8,10)) + '</span><span class="dots">' + dots + '</span>';
    c.onclick = () => { dayIdx = i; renderDay(); syncStrip(); };
    el.appendChild(c);
  });
}
function syncStrip(){
  const el = document.getElementById("strip");
  [...el.children].forEach((c, i) => c.setAttribute("aria-selected", i === dayIdx));
  const sel = el.children[dayIdx];
  if(sel) el.scrollTo({left: sel.offsetLeft - el.clientWidth/2 + sel.clientWidth/2, behavior:"smooth"});
  [...document.querySelectorAll("#grid tbody tr")].forEach((tr,i)=>tr.classList.toggle("sel", i===dayIdx));
}

/* ---------- day ribbon ---------- */
function renderDay(){
  const d = days()[dayIdx];
  const prev = days()[dayIdx - 1];
  document.getElementById("dayTitle").textContent =
    d.dow.replace("Mån","Måndag").replace("Tis","Tisdag").replace("Ons","Onsdag")
         .replace("Tor","Torsdag").replace("Fre","Fredag").replace("Lör","Lördag").replace("Sön","Söndag")
    + " " + Number(d.date.slice(8,10)) + " " + MN[month];

  const working = PEOPLE.filter(p => d.shifts[p].length);
  const free = PEOPLE.filter(p => !d.shifts[p].length);
  document.getElementById("summary").textContent =
    working.length + " på jobbet · ledig: " + (free.length ? free.join(", ") : "ingen");

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  PEOPLE.forEach(p => {
    const r = document.createElement("div");
    r.className = "row" + (solo === p ? " on" : "");
    r.tabIndex = 0;
    r.onclick = () => { solo = (solo === p ? null : p); renderDay(); };
    r.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); r.click(); } };

    let bars = "";
    /* nattpass som spiller in på morgonen */
    if(prev) (prev.shifts[p] || []).forEach(s => {
      if(s.s !== null && s.e < s.s)
        bars += '<div class="bar night spill" style="width:' + pct(s.e) + '%"><span>till ' + s.end + '</span></div>';
    });
    d.shifts[p].forEach(s => {
      if(s.s === null){
        bars += '<div class="bar day" style="left:0;width:100%">' + s.code + '</div>';
        return;
      }
      const wraps = s.e < s.s;
      const w = wraps ? (1440 - s.s) : (s.e - s.s);
      const cls = "bar " + kind(s) + (dur(s) >= 600 ? " long" : "");
      bars += '<div class="' + cls + '" style="left:' + pct(s.s) + '%;width:' + pct(w) + '%">' +
              '<span>' + s.code + ' ' + s.start + '–' + s.end + '</span>' +
              (wraps ? '<span class="cont">→</span>' : '') + '</div>';
    });
    if(!bars) bars = '<span class="free">ledig</span>';

    r.innerHTML = '<div class="who">' + p + '</div><div class="track">' + bars + '</div>';
    rows.appendChild(r);
  });
  rows.parentElement.classList.toggle("soloing", !!solo);
  document.body.classList.toggle("soloing", !!solo);
}

/* ---------- month grid ---------- */
function renderGrid(){
  document.getElementById("monthHead").textContent = "Hela " + MN[month];
  const t = document.getElementById("grid");
  t.innerHTML = "<thead><tr><th></th><th>" +
    PEOPLE.map(p => p.slice(0,3)).join("</th><th>") + "</th></tr></thead>";
  const tb = document.createElement("tbody");
  days().forEach((d, i) => {
    const tr = document.createElement("tr");
    tr.className = (["Lör","Sön"].includes(d.dow) ? "we " : "") + (i === dayIdx ? "sel" : "");
    let tds = "<td>" + d.dow + " " + Number(d.date.slice(8,10)) + "</td>";
    PEOPLE.forEach(p => {
      const list = d.shifts[p];
      const inner = list.length
        ? list.map(s => '<b class="' + kind(s) + '"></b>').join("")
        : "<b></b>";
      tds += '<td><div class="cell">' + inner + '</div></td>';
    });
    tr.innerHTML = tds;
    tr.onclick = () => { dayIdx = i; renderDay(); syncStrip();
      document.querySelector(".daybar").scrollIntoView({behavior:"smooth", block:"start"}); };
    tb.appendChild(tr);
  });
  t.appendChild(tb);
}

/* ---------- now line ---------- */
function renderNow(){
  document.querySelectorAll(".now").forEach(n => n.remove());
  const today = new Date();
  const iso = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" +
              String(today.getDate()).padStart(2,"0");
  if(days()[dayIdx].date !== iso) return;
  const left = pct(today.getHours()*60 + today.getMinutes());
  document.querySelectorAll(".track").forEach(t => {
    const n = document.createElement("div");
    n.className = "now"; n.style.left = left + "%";
    t.appendChild(n);
  });
}

function renderAll(){
  [...monthsEl.children].forEach(b => b.setAttribute("aria-pressed", b.textContent === month));
  /* hoppa till dagens datum om den finns i månaden */
  const today = new Date();
  const iso = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" +
              String(today.getDate()).padStart(2,"0");
  const t = days().findIndex(d => d.date === iso);
  if(t > -1) dayIdx = t;
  renderStrip(); renderGrid(); renderDay(); syncStrip(); renderNow();
}

document.getElementById("prev").onclick = () => { if(dayIdx > 0){ dayIdx--; renderDay(); syncStrip(); renderNow(); } };
document.getElementById("next").onclick = () => { if(dayIdx < days().length-1){ dayIdx++; renderDay(); syncStrip(); renderNow(); } };

document.getElementById("foot").textContent =
  "Byggt från Sorre-schema.xlsx · " + PEOPLE.length + " personer · " +
  MONTHS.map(m => DATA[m].days.length + " dagar i " + MN[m]).join(", ") + ".";

renderAll();
</script>
