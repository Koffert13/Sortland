<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sortland · schema juli–augusti 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Blåbyen: fjorden, husfasaderna, midnattssolen, norrskenet */
  --ground:#071726;
  --surface:#0D2739;
  --surface-2:#143650;
  --rule:#1E4966;
  --text:#E4F0F8;
  --muted:#7CA3BF;
  --facade:#2F79B5;
  --day:#F5BE55;      /* midnattssol */
  --eve:#EF7FA3;      /* kvällsljus över sundet */
  --night:#63E0C4;    /* norrsken */
  --free:#12354C;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--text);font-family:var(--body);
  -webkit-font-smoothing:antialiased;padding:0 0 48px
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* ---------- panorama ---------- */
.pano{display:block;width:100%;max-width:620px;margin:0 auto;height:auto}

/* ---------- header ---------- */
header{padding:16px 0 18px}
.kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px
}
h1{
  font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);
  line-height:.95;letter-spacing:-.035em;margin:0
}
h1 em{font-style:normal;color:var(--facade)}
.months{display:flex;gap:6px;margin-top:18px}
.months button{
  flex:1;padding:11px 8px;border-radius:11px;border:1px solid var(--rule);
  background:transparent;color:var(--muted);font-family:var(--body);
  font-weight:600;font-size:14px;cursor:pointer;transition:.18s
}
.months button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--facade)}

/* ---------- datumremsa ---------- */
.strip{
  display:flex;gap:6px;overflow-x:auto;padding:16px 16px 10px;margin:0 -16px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none
}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;width:46px;padding:8px 0 9px;border-radius:12px;border:1px solid var(--rule);
  background:var(--surface);color:var(--muted);text-align:center;cursor:pointer;
  scroll-snap-align:center;transition:.15s
}
.chip .dw{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;display:block}
.chip .dn{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;display:block;color:var(--text)}
.chip .dots{display:flex;gap:2px;justify-content:center;margin-top:5px;height:4px}
.chip .dots i{width:4px;height:4px;border-radius:50%;background:var(--free)}
.chip[aria-selected="true"]{background:#EAF4FB;border-color:#EAF4FB}
.chip[aria-selected="true"] .dn,.chip[aria-selected="true"] .dw{color:#071726}
.chip.weekend .dw{color:var(--eve)}

/* ---------- dagsribban ---------- */
.daybar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 0 4px}
.daybar h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0}
.arrows{display:flex;gap:6px}
.arrows button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);
  background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;line-height:1
}
.arrows button:disabled{opacity:.3;cursor:default}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 3px;line-height:1.6}
.meta .sun{color:var(--day)}
.axis{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
  color:var(--muted);padding:0 0 4px;margin-left:64px;letter-spacing:.05em
}
.rows{border-top:1px solid var(--rule)}
.row{
  display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer
}
.row:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.who{font-weight:600;font-size:12.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{
  position:relative;height:30px;border-radius:8px;overflow:hidden;
  background-image:linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),var(--sky,var(--surface));
  background-size:25% 100%,100% 100%
}
.bar{
  position:absolute;top:3px;bottom:3px;border-radius:6px;display:flex;align-items:center;
  padding:0 6px;overflow:hidden;font-family:var(--mono);font-size:9.5px;font-weight:600;
  color:#071726;white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.35)
}
.bar.day{background:var(--day)}
.bar.eve{background:var(--eve)}
.bar.night{background:var(--night)}
.bar.long::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(7,23,38,.17) 0 5px,transparent 5px 11px)
}
.bar.spill{opacity:.34;border-radius:0 6px 6px 0;left:0!important;box-shadow:none}
.bar .cont{margin-left:auto;opacity:.7}
.now{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8;z-index:3}
.free{font-family:var(--mono);font-size:10px;color:var(--muted);position:absolute;left:8px;top:50%;transform:translateY(-50%)}
.soloing .row{opacity:.3}
.soloing .row.on{opacity:1}

/* ---------- teckenförklaring ---------- */
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:16px 0 4px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- månadsrutnät ---------- */
.section-h{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)
}
.grid{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}
.grid th{color:var(--muted);font-weight:400;padding:0 0 8px;text-align:center;font-size:9.5px;letter-spacing:.06em}
.grid th:first-child{text-align:left;width:52px}
.grid td{padding:0;height:20px}
.grid td:first-child{color:var(--muted);white-space:nowrap;font-size:9.5px;padding-right:6px}
.grid tr.we td:first-child{color:var(--eve);opacity:.85}
.cell{display:flex;gap:1.5px;justify-content:center;padding:2px 1.5px}
.cell b{display:block;height:15px;flex:1;border-radius:3px;background:var(--free)}
.cell b.day{background:var(--day)}
.cell b.eve{background:var(--eve)}
.cell b.night{background:var(--night)}
.grid tbody tr{cursor:pointer}
.grid tbody tr.sel{background:var(--surface-2);outline:1px solid var(--facade)}
.grid tbody tr.sel td:first-child{color:var(--text)}

footer{margin-top:34px;font-size:10.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}

/* ---------- välkomstruta ---------- */
body.modal-open{overflow:hidden}
.overlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(7,23,38,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:fade .25s ease-out
}
.overlay[hidden]{display:none}
.modal{
  position:relative;max-width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,.9,.3,1)
}
.modal img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:var(--ground)}
.modal .cap{padding:14px 16px 16px}
.modal .go{
  width:100%;padding:12px;border-radius:11px;border:1px solid var(--facade);
  background:var(--surface-2);color:var(--text);font-family:var(--body);font-weight:600;font-size:14px;cursor:pointer
}
.modal .go:hover{background:var(--facade);color:#071726}
.modal .x{
  position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--rule);background:rgba(7,23,38,.7);color:var(--text);
  font-size:18px;line-height:1;cursor:pointer
}
.modal .x:hover{background:var(--ground)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const pct  = m => m / 1440 * 100;

/* alla dagar i följd, så vi kan gå över månadsskiftet */
const ALL = MONTHS.flatMap(m => DATA[m].days.map(d => ({month: m, day: d})));
const todayISO = () => {
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
};
/* grannen `step` dagar bort, oavsett vilken månad den ligger i */
function neighbour(step){
  const i = ALL.findIndex(x => x.day.date === days()[dayIdx].date);
  return i < 0 ? null : (ALL[i + step] || null);
}
function goDay(step){
  const t = neighbour(step);
  if(!t) return;
  dayIdx = DATA[t.month].days.indexOf(t.day);
  if(t.month !== month){ month = t.month; renderMonth(); }
  else { renderDay(); syncStrip(); renderNow(); }
}
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(Math.round(m)%60).padStart(2,"0");

/* ---------- solhöjd över Sortland ---------- */
const D2R = Math.PI/180;
function elevation(ms){
  const n = ms/86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * D2R;
  const lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * D2R;
  const eps = (23.439 - 0.0000004*n) * D2R;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra  = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam));
  let gmst = (18.697374558 + 24.06570982441908*n) % 24; if(gmst < 0) gmst += 24;
  const H = ((gmst + LON/15)*15 - ra/D2R) * D2R;
  const phi = LAT*D2R;
  return Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H)) / D2R;
}
function skyColor(e){
  if(e >=  6) return "#17567D";
  if(e >=  0) return "#1B4A6C";
  if(e >= -6) return "#123A56";
  if(e >= -12) return "#0D2B41";
  return "#082032";
}
function sun(dateStr){
  const [Y,M,D] = dateStr.split("-").map(Number);
  const stops = [], samples = [];
  for(let i = 0; i <= 48; i++){
    const min = i*30;
    const e = elevation(Date.UTC(Y, M-1, D, 0, min - TZ));
    samples.push(e);
    stops.push(skyColor(e) + " " + pct(min).toFixed(2) + "%");
  }
  /* fin upplösning för upp-/nedgång */
  let rise = null, set = null, prev = null, min = 99, max = -99;
  for(let m = 0; m <= 1440; m += 2){
    const e = elevation(Date.UTC(Y, M-1, D, 0, m - TZ));
    min = Math.min(min, e); max = Math.max(max, e);
    if(prev !== null){
      if(prev < -0.833 && e >= -0.833) rise = m;
      if(prev >= -0.833 && e < -0.833) set = m;
    }
    prev = e;
  }
  return {grad: "linear-gradient(90deg," + stops.join(",") + ")", rise, set, min, max};
}

/* ---------- månadsknappar ---------- */
const monthsEl = document.getElementById("months");
MONTHS.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m;
  b.onclick = () => {
    month = m;
    const i = days().findIndex(d => d.date === todayISO());
    dayIdx = i > -1 ? i : 0;
    renderMonth();
  };
  monthsEl.appendChild(b);
});

/* ---------- datumremsa ---------- */
function renderStrip(){
  const el = document.getElementById("strip");
  el.innerHTML = "";
  days().forEach((d, i) => {
    const c = document.createElement("button");
    c.className = "chip" + (["Lör","Sön"].includes(d.dow) ? " weekend" : "");
    c.setAttribute("aria-selected", i === dayIdx);
    const dots = PEOPLE.map(p => {
      const l = d.shifts[p];
      return l.length ? '<i style="background:var(--' + kind(l[0]) + ')"></i>' : '<i></i>';
    }).join("");
    c.innerHTML = '<span class="dw">' + d.dow + '</span><span class="dn">' +
      Number(d.date.slice(8,10)) + '</span><span class="dots">' + dots + '</span>';
    c.onclick = () => { dayIdx = i; renderDay(); syncStrip(); };
    el.appendChild(c);
  });
}
function syncStrip(){
  const el = document.getElementById("strip");
  [...el.children].forEach((c, i) => c.setAttribute("aria-selected", i === dayIdx));
  const sel = el.children[dayIdx];
  if(sel) el.scrollTo({left: sel.offsetLeft - el.clientWidth/2 + sel.clientWidth/2, behavior:"smooth"});
  [...document.querySelectorAll("#grid tbody tr")].forEach((tr,i) => tr.classList.toggle("sel", i === dayIdx));
}

/* ---------- dagsribban ---------- */
const LONG = {Mån:"Måndag",Tis:"Tisdag",Ons:"Onsdag",Tor:"Torsdag",Fre:"Fredag",Lör:"Lördag",Sön:"Söndag"};
function renderDay(){
  const d = days()[dayIdx], prev = (neighbour(-1) || {}).day;
  document.getElementById("prev").disabled = !neighbour(-1);
  document.getElementById("next").disabled = !neighbour(1);
  document.getElementById("dayTitle").textContent =
    (LONG[d.dow] || d.dow) + " " + Number(d.date.slice(8,10)) + " " + MN[month];

  const working = PEOPLE.filter(p => d.shifts[p].length);
  const free = PEOPLE.filter(p => !d.shifts[p].length);
  document.getElementById("summary").textContent =
    working.length + " på jobbet · ledig: " + (free.length ? free.join(", ") : "ingen");

  const s = sun(d.date);
  const daylight = (s.rise !== null && s.set !== null) ? (s.set - s.rise + 1440) % 1440 : null;
  document.getElementById("light").innerHTML = s.min > -0.833
    ? '<span class="sun">Midnattssol</span> · solen går inte ner'
    : (s.rise === null || s.set === null
        ? 'Skymningsljus hela dygnet'
        : (s.set < s.rise
            ? '<span class="sun">Solen nere</span> ' + hhmm(s.set) + '–' + hhmm(s.rise) +
              ' · ' + hhmm(daylight) + ' h dagsljus'
            : '<span class="sun">Sol</span> ' + hhmm(s.rise) + '–' + hhmm(s.set) +
              ' · ' + hhmm(daylight) + ' h dagsljus'));

  const rows = document.getElementById("rows");
  rows.style.setProperty("--sky", s.grad);
  rows.innerHTML = "";
  PEOPLE.forEach(p => {
    const r = document.createElement("div");
    r.className = "row" + (solo === p ? " on" : "");
    r.tabIndex = 0;
    r.onclick = () => { solo = (solo === p ? null : p); renderDay(); renderNow(); };
    r.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); r.click(); } };

    let bars = "";
    if(prev) (prev.shifts[p] || []).forEach(x => {
      if(x.s !== null && x.e < x.s)
        bars += '<div class="bar night spill" style="width:' + pct(x.e) + '%"><span>till ' + x.end + '</span></div>';
    });
    d.shifts[p].forEach(x => {
      if(x.s === null){ bars += '<div class="bar day" style="left:0;width:100%">' + x.code + '</div>'; return; }
      const wraps = x.e < x.s;
      const w = wraps ? (1440 - x.s) : (x.e - x.s);
      bars += '<div class="bar ' + kind(x) + (dur(x) >= 600 ? " long" : "") +
              '" style="left:' + pct(x.s) + '%;width:' + pct(w) + '%">' +
              '<span>' + x.code + ' ' + x.start + '–' + x.end + '</span>' +
              (wraps ? '<span class="cont">→</span>' : '') + '</div>';
    });
    if(!bars) bars = '<span class="free">ledig</span>';

    r.innerHTML = '<div class="who">' + p + '</div><div class="track">' + bars + '</div>';
    rows.appendChild(r);
  });
  document.querySelector(".wrap").classList.toggle("soloing", !!solo);
}

/* ---------- månadsrutnät ---------- */
function renderGrid(){
  document.getElementById("monthHead").textContent = "Hela " + MN[month];
  const t = document.getElementById("grid");
  t.innerHTML = "<thead><tr><th></th><th>" + PEOPLE.map(p => p.slice(0,3)).join("</th><th>") + "</th></tr></thead>";
  const tb = document.createElement("tbody");
  days().forEach((d, i) => {
    const tr = document.createElement("tr");
    tr.className = (["Lör","Sön"].includes(d.dow) ? "we " : "") + (i === dayIdx ? "sel" : "");
    let tds = "<td>" + d.dow + " " + Number(d.date.slice(8,10)) + "</td>";
    PEOPLE.forEach(p => {
      const l = d.shifts[p];
      tds += '<td><div class="cell">' +
             (l.length ? l.map(x => '<b class="' + kind(x) + '"></b>').join("") : "<b></b>") +
             '</div></td>';
    });
    tr.innerHTML = tds;
    tr.onclick = () => {
      dayIdx = i; renderDay(); syncStrip(); renderNow();
      document.querySelector(".daybar").scrollIntoView({behavior:"smooth", block:"start"});
    };
    tb.appendChild(tr);
  });
  t.appendChild(tb);
}

/* ---------- nu-linje ---------- */
function renderNow(){
  document.querySelectorAll(".now").forEach(n => n.remove());
  const t = new Date();
  const iso = t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
  if(days()[dayIdx].date !== iso) return;
  const left = pct(t.getHours()*60 + t.getMinutes());
  document.querySelectorAll(".track").forEach(tr => {
    const n = document.createElement("div");
    n.className = "now"; n.style.left = left + "%";
    tr.appendChild(n);
  });
}

/* ritar om allt för vald månad och dag */
function renderMonth(){
  [...monthsEl.children].forEach(b => b.setAttribute("aria-pressed", b.textContent === month));
  renderStrip(); renderGrid(); renderDay(); syncStrip(); renderNow();
}
/* som ovan, men börjar på dagens datum om det finns i schemat */
function renderAll(){
  const hit = ALL.find(x => x.day.date === todayISO());
  if(hit){ month = hit.month; dayIdx = DATA[hit.month].days.indexOf(hit.day); }
  renderMonth();
}

document.getElementById("prev").onclick = () => goDay(-1);
document.getElementById("next").onclick = () => goDay(1);

/* nu-linjen ska följa klockan, inte bara sidladdningen */
setInterval(renderNow, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) renderNow(); });

document.getElementById("foot").innerHTML =
  "Byggt från Sorre-schema.xlsx · " + PEOPLE.length + " personer · " +
  MONTHS.map(m => DATA[m].days.length + " dagar i " + MN[m]).join(", ") +
  ".<br>Ljuset räknas ut för 68,696° N, 15,413° Ö (Sortland) i norsk sommartid.";

renderAll();

/* ---------- välkomstruta ---------- */
(function(){
  const ov = document.getElementById("overlay");
  const close = document.getElementById("popupClose");
  const prevFocus = document.activeElement;

  ov.hidden = false;
  document.body.classList.add("modal-open");
  document.getElementById("popupOk").focus();

  function dismiss(){
    ov.hidden = true;
    document.body.classList.remove("modal-open");
    document.removeEventListener("keydown", onKey);
    if(prevFocus && prevFocus.focus) prevFocus.focus();
  }
  function onKey(e){
    if(e.key === "Escape"){ dismiss(); return; }
    if(e.key !== "Tab") return;
    /* håll fokus inne i rutan */
    const f = [close, document.getElementById("popupOk")];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
  }

  close.onclick = dismiss;
  document.getElementById("popupOk").onclick = dismiss;
  ov.onclick = e => { if(e.target === ov) dismiss(); };
  document.addEventListener("keydown", onKey);
})();
</script>
</body>
